name: iOS Environment
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: bash ios/Scripts/install-xcodegen.sh
      - run: python3 ios/Scripts/probe-environment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-environment
          path: artifacts/
