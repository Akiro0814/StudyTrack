name: iOS CI
on:
  workflow_dispatch:
  pull_request:
    paths: ['ios/**', 'shared-spec/**', '.github/workflows/ios-*.yml']
  push:
    paths: ['ios/**', 'shared-spec/**', '.github/workflows/ios-*.yml']
permissions:
  contents: read
concurrency:
  group: ios-simulator-matrix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.devices.outputs.devices }}
    steps:
      - uses: actions/checkout@v4
      - id: devices
        run: python3 -c 'import json,os; ids=json.load(open("ios/Toolchain.lock.json"))["deviceTypeIDs"]; assert ids; open(os.environ["GITHUB_OUTPUT"],"a").write("devices="+json.dumps(ids)+"\n")'
  simulator:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        device_type: ${{ fromJSON(needs.matrix.outputs.devices) }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      STUDYTRACK_DEVICE_TYPE: ${{ matrix.device_type }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check database contracts
        run: |
          node ios/Scripts/check-contracts.mjs
          node ios/Scripts/check-school-contracts.mjs
      - name: Select locked Apple toolchain
        run: |
          python3 ios/Scripts/probe-environment.py
          python3 -c 'import json,os; p=json.load(open("artifacts/Toolchain.candidate.json")); open(os.environ["GITHUB_ENV"],"a").write("DEVELOPER_DIR="+p["developerDirectory"]+"\n")'
      - name: Install pinned XcodeGen
        run: bash ios/Scripts/install-xcodegen.sh
      - uses: actions/cache@v4
        with:
          path: |
            ios/.build
            ios/.spm
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ios/Package.resolved', 'ios/Toolchain.lock.json') }}
      - name: Core tests
        working-directory: ios
        run: |
          set -o pipefail
          swift test --parallel 2>&1 | tee ../core-tests.log
      - name: Simulator matrix
        run: bash ios/Scripts/test-simulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-validation-${{ github.sha }}-${{ matrix.device_type }}
          path: |
            artifacts/
            core-tests.log
            ios/Package.resolved
            ios/StudyTrack.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          retention-days: 14
