name: Android Verification
on:
  workflow_dispatch:
  push:
    paths: ['app/**', 'ios/StudyTrackTests/Fixtures/**', 'build.gradle.kts', 'gradle/**', 'gradle.properties', 'gradlew*', 'settings.gradle.kts', '.github/workflows/android-migration.yml']
permissions:
  contents: read
concurrency:
  group: android-migration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Prepare SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - name: Build, lint and test Android
        run: gradle -Dorg.gradle.java.home="$JAVA_HOME" :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/outputs/apk/
