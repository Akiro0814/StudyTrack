name: StudyTrack
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: '26.0'
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
packages:
  StudyTrackCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '6.0'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '1.1.0'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  StudyTrack:
    type: application
    platform: iOS
    sources:
      - StudyTrack/App
      - StudyTrack/Features
      - StudyTrack/DesignSystem
      - path: StudyTrack/Resources
        excludes: [Info.plist]
    info:
      path: StudyTrack/Resources/Info.plist
      properties:
        CFBundleDisplayName: 学迹
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: StudyTrack Analysis
            CFBundleURLSchemes: [studytrack]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Excel Workbook
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.openxmlformats.spreadsheetml.sheet]
          - CFBundleTypeName: StudyTrack Backup
            LSHandlerRank: Owner
            LSItemContentTypes: [com.repea.studytrack.ios.backup]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.repea.studytrack.ios.backup
            UTTypeDescription: StudyTrack Backup
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [studytrackbackup]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.openxmlformats.spreadsheetml.sheet
            UTTypeDescription: Excel Workbook
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [xlsx]
              public.mime-type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        NSUbiquitousContainers:
          iCloud.com.repea.studytrack.ios:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: StudyTrack
            NSUbiquitousContainerSupportedFolderLevels: Any
    entitlements:
      path: Config/StudyTrack.entitlements
      properties:
        com.apple.security.application-groups: [group.com.repea.studytrack.ios]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.repea.studytrack.ios]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.repea.studytrack.ios]
        com.apple.developer.icloud-services: [CloudDocuments]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.repea.studytrack.ios
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
    dependencies:
      - package: StudyTrackCore
      - target: StudyTrackWidgets
        embed: true
  StudyTrackWidgets:
    type: app-extension
    platform: iOS
    sources: [StudyTrackWidgets]
    info:
      path: StudyTrackWidgets/Info.plist
      properties:
        CFBundleDisplayName: 学迹小组件
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/StudyTrackWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.repea.studytrack.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.repea.studytrack.ios.widgets
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: '1'
    dependencies:
      - package: StudyTrackCore
  StudyTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources: [StudyTrackTests]
    dependencies:
      - target: StudyTrack
      - package: StudyTrackCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.repea.studytrack.ios.tests
  StudyTrackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [StudyTrackUITests]
    dependencies:
      - target: StudyTrack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.repea.studytrack.ios.uitests
schemes:
  StudyTrack:
    build:
      targets:
        StudyTrack: all
    test:
      gatherCoverageData: true
      targets: [StudyTrackTests, StudyTrackUITests]
    archive:
      config: Release
